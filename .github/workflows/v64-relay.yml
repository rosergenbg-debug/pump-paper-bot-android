name: V6.4 Release Relay

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Download official signed V6.4 APK
        run: |
          curl -fL --retry 3 \
            -o PumpSignal-V6.4-Compatible-Signed.apk \
            https://github.com/rosergenbg-debug/pump-paper-bot-android/releases/download/v6.4/PumpSignal-V6.4-Compatible-Signed.apk
          echo "301cff0818e43696c9b6d28f009763477b8a79afa38e3dc55b8c65a4533ff804  PumpSignal-V6.4-Compatible-Signed.apk" | sha256sum -c -
      - name: Upload exact release APK
        uses: actions/upload-artifact@v4
        with:
          name: PumpSignal-V6.4-Compatible-Signed-Relay
          path: PumpSignal-V6.4-Compatible-Signed.apk
          retention-days: 1
