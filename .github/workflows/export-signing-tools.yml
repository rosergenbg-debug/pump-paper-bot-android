name: Export Android signing tools

on:
  push:
    branches:
      - main

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Build Tools 34 signing utilities
        shell: bash
        run: |
          set -euo pipefail
          SRC="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$SRC/apksigner"
          test -f "$SRC/lib/apksigner.jar"
          test -x "$SRC/aapt"
          mkdir -p export/lib
          cp "$SRC/apksigner" export/apksigner
          cp "$SRC/lib/apksigner.jar" export/lib/apksigner.jar
          cp "$SRC/aapt" export/aapt
          chmod +x export/apksigner export/aapt
          sha256sum export/apksigner export/lib/apksigner.jar export/aapt > export/SHA256SUMS

      - name: Upload signing utilities
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-34-signing-utilities
          path: export
          retention-days: 1
