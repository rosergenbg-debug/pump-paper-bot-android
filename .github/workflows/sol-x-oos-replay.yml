name: SOL X OOS Replay

on:
  push:
    branches: [ "research/sol-x-oos-2026-02" ]
    paths:
      - "tools/research_sol_x_exact.js"
      - ".github/workflows/sol-x-oos-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run exact historical X semantics on SOL Feb 2026
        run: node tools/research_sol_x_exact.js | tee sol_x_exact_console.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sol-x-exact-2026-02
          path: |
            sol_x_exact_results/
            sol_x_exact_console.txt
