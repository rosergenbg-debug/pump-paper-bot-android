name: Export Android Apksigner Temp

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Stage apksigner 34
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apksigner-tool/lib"
          cp "$ANDROID_HOME/build-tools/34.0.0/apksigner" "$RUNNER_TEMP/apksigner-tool/apksigner"
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" "$RUNNER_TEMP/apksigner-tool/lib/apksigner.jar"
          chmod +x "$RUNNER_TEMP/apksigner-tool/apksigner"
      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-Apksigner-34-Temp
          path: ${{ runner.temp }}/apksigner-tool
          retention-days: 1
