name: V5.25 Exact Compatible Sign

on:
  push:
    branches: [ "chatgpt/v5-25-six-account-comparison" ]
    paths:
      - ".github/workflows/v525-sign.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact verified V5.25 artifact from run 32593378264
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: PumpSignal-V5.25-Six-Accounts-APK
          path: input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32593378264

      - name: Find exact compatible key and sign
        id: sign
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          KS_PUMP: ${{ secrets.PUMP_SIGNING_KEYSTORE_BASE64 }}
          KS_ANDROID: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_RELEASE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SP_PUMP: ${{ secrets.PUMP_SIGNING_STORE_PASSWORD }}
          SP_PUMP2: ${{ secrets.PUMP_SIGNING_KEYSTORE_PASSWORD }}
          SP_ANDROID: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SP_GENERIC: ${{ secrets.KEYSTORE_PASSWORD }}
          KP_PUMP: ${{ secrets.PUMP_SIGNING_KEY_PASSWORD }}
          KP_ANDROID: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KP_GENERIC: ${{ secrets.KEY_PASSWORD }}
          AL_PUMP: ${{ secrets.PUMP_SIGNING_KEY_ALIAS }}
          AL_ANDROID: ${{ secrets.ANDROID_KEY_ALIAS }}
          AL_GENERIC: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED="1f778c4291c9d11c5f89f4de8773bda35a0125031adc05785daee23f27dc7823"
          KEYFILE="$RUNNER_TEMP/pump-compatible.jks"
          INPUT_APK="$(find input -type f -name '*.apk' | head -n 1)"
          [ -n "$INPUT_APK" ] || { echo "NO_APK_IN_VERIFIED_ARTIFACT" > sign-reason.txt; exit 40; }

          PASS=""
          KEY_SOURCE=""
          for name in KS_PUMP KS_ANDROID KS_RELEASE KS_KEYSTORE; do
            value="${!name:-}"
            if [ -n "$value" ] && printf '%s' "$value" | base64 --decode > "$KEYFILE" 2>/dev/null && [ -s "$KEYFILE" ]; then
              KEY_SOURCE="$name"
              for pname in SP_PUMP SP_PUMP2 SP_ANDROID SP_GENERIC; do
                pvalue="${!pname:-}"
                if [ -n "$pvalue" ] && keytool -list -keystore "$KEYFILE" -storepass "$pvalue" >/dev/null 2>&1; then PASS="$pvalue"; break; fi
              done
              [ -n "$PASS" ] && break
            fi
          done

          if [ -z "$PASS" ]; then
            # Historical key was accidentally committed on 2026-07-25 and then removed.
            # Recover it only to compare its public certificate fingerprint. Never use it
            # unless it is exactly the installed-compatible certificate.
            if git show 25850ffbcce678b9c8033466b9e9b7a3eae1c075:signing/pump-signal-release.jks.b64 > "$RUNNER_TEMP/historical.b64" 2>/dev/null; then
              base64 --decode "$RUNNER_TEMP/historical.b64" > "$KEYFILE"
              OLD_WORKFLOW=$(git show 26a020813e67eef4cce08bb33ca5ffbddf0c047e^:.github/workflows/android.yml 2>/dev/null || true)
              PASS=$(printf '%s\n' "$OLD_WORKFLOW" | sed -n 's/^[[:space:]]*PUMP_SIGNING_STORE_PASSWORD:[[:space:]]*//p' | head -n 1)
              if [ -z "$PASS" ] || ! keytool -list -keystore "$KEYFILE" -storepass "$PASS" >/dev/null 2>&1; then
                echo "NO_CURRENT_KEY_AND_HISTORICAL_KEY_COULD_NOT_BE_OPENED" > sign-reason.txt
                exit 41
              fi
              KEY_SOURCE="HISTORICAL_PUBLIC_GIT_KEY"
            else
              echo "NO_COMPATIBLE_KEYSTORE_SECRET_PRESENT" > sign-reason.txt
              exit 41
            fi
          fi

          keytool -list -v -keystore "$KEYFILE" -storepass "$PASS" > "$RUNNER_TEMP/keyinfo.txt"
          FOUND=$(grep -i 'SHA256:' "$RUNNER_TEMP/keyinfo.txt" | tr -d ': ' | tr 'A-F' 'a-f' || true)
          if ! printf '%s\n' "$FOUND" | grep -Fq "$EXPECTED"; then
            if [ "$KEY_SOURCE" = "HISTORICAL_PUBLIC_GIT_KEY" ]; then
              echo "HISTORICAL_COMPROMISED_KEY_IS_NOT_CURRENT_COMPATIBLE_CERT" > sign-reason.txt
            else
              echo "KEYSTORE_CERTIFICATE_MISMATCH" > sign-reason.txt
            fi
            printf '%s\n' "$FOUND" | head -n 1 > found-cert.txt
            exit 43
          fi

          ALIAS=""
          for candidate in "${AL_PUMP:-}" "${AL_ANDROID:-}" "${AL_GENERIC:-}" "pump-signal-update" "pump-update"; do
            [ -z "$candidate" ] && continue
            if keytool -list -keystore "$KEYFILE" -storepass "$PASS" -alias "$candidate" >/dev/null 2>&1; then ALIAS="$candidate"; break; fi
          done
          [ -n "$ALIAS" ] || { echo "COMPATIBLE_CERT_FOUND_BUT_ALIAS_NOT_RESOLVED" > sign-reason.txt; exit 44; }

          KEYPASS=""
          for candidate in "${KP_PUMP:-}" "${KP_ANDROID:-}" "${KP_GENERIC:-}" "$PASS"; do
            [ -z "$candidate" ] && continue
            if "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
                --ks "$KEYFILE" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$candidate" \
                --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
                --out "$RUNNER_TEMP/test-signed.apk" "$INPUT_APK" >/dev/null 2>&1; then KEYPASS="$candidate"; break; fi
          done
          [ -n "$KEYPASS" ] || { echo "COMPATIBLE_KEY_FOUND_BUT_KEY_PASSWORD_NOT_RESOLVED" > sign-reason.txt; exit 45; }

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$KEYFILE" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out PumpSignal-V5.25-Compatible-FINAL.apk "$INPUT_APK"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs PumpSignal-V5.25-Compatible-FINAL.apk > "$RUNNER_TEMP/verify.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/verify.txt"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/verify.txt"
          ACTUAL=$(grep -F "Signer #1 certificate SHA-256 digest:" "$RUNNER_TEMP/verify.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "FINAL_CERTIFICATE_MISMATCH" > sign-reason.txt; exit 46; }

          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging PumpSignal-V5.25-Compatible-FINAL.apk > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.example.pumppaperbot.v8' versionCode='105' versionName='5.25'" "$RUNNER_TEMP/badging.txt"
          grep -F "launchable-activity: name='com.example.pumppaperbot.MainActivity'" "$RUNNER_TEMP/badging.txt"
          unzip -t PumpSignal-V5.25-Compatible-FINAL.apk >/dev/null
          sha256sum PumpSignal-V5.25-Compatible-FINAL.apk | awk '{print $1}' > final-sha256.txt
          echo "SIGNED_OK" > sign-reason.txt

      - name: Publish diagnostic result
        if: always()
        run: |
          mkdir -p dist
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "download_outcome=${{ steps.download.outcome }}"
            echo "sign_outcome=${{ steps.sign.outcome }}"
            if [ -f sign-reason.txt ]; then printf 'result='; cat sign-reason.txt; else echo "result=SIGN_STEP_NOT_REACHED"; fi
            echo "expected_certificate_sha256=1f778c4291c9d11c5f89f4de8773bda35a0125031adc05785daee23f27dc7823"
            if [ -f found-cert.txt ]; then printf 'historical_certificate_sha256='; cat found-cert.txt; fi
            if [ -f final-sha256.txt ]; then printf 'apk_sha256='; cat final-sha256.txt; fi
          } > dist/V5.25_SIGNING_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/V5.25_SIGNING_STATUS.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update V5.25 signing diagnostic"
          git push

      - name: Upload compatible V5.25 APK
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PumpSignal-V5.25-Compatible-FINAL
          path: PumpSignal-V5.25-Compatible-FINAL.apk
          retention-days: 7
