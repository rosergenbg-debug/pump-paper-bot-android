name: V6.9.11 Fusion Compact · safe build

on:
  push:
    branches: ["codex/v6.9.11-notification-compact-market-20261103"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile and unit test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Verify APK package and launcher
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/badging.txt"
          grep -F "versionCode='140' versionName='6.9.11'" "$RUNNER_TEMP/badging.txt"
          grep -F "launchable-activity: name='com.example.pumppaperbot.FusionDashboardActivity'" "$RUNNER_TEMP/badging.txt"
          # All current PumpAlert notifications must open Fusion, never legacy MainActivity.
          grep -F 'Intent(context, FusionDashboardActivity::class.java)' app/src/main/java/com/example/pumppaperbot/PumpAlert.kt
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PUMP-Fusion-6.9.11-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Bundle Android SDK signer for offline compatible release signing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-sign-tools"
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" "$RUNNER_TEMP/apk-sign-tools/apksigner.jar"
          cp "$ANDROID_HOME/build-tools/34.0.0/apksigner" "$RUNNER_TEMP/apk-sign-tools/apksigner"
      - name: Upload official Android SDK APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: PUMP-6.9.11-android-signer-tools
          path: ${{ runner.temp }}/apk-sign-tools/
          retention-days: 1
      - name: Upload unsigned release APK for offline same-key signing
        uses: actions/upload-artifact@v4
        with:
          name: PUMP-Fusion-6.9.11-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
      - name: Sign V6.9.11 with the compatible PumpSignal update key
        env:
          KS_PUMP: ${{ secrets.PUMP_SIGNING_KEYSTORE_BASE64 }}
          KS_ANDROID: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_RELEASE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SP_PUMP: ${{ secrets.PUMP_SIGNING_STORE_PASSWORD }}
          SP_PUMP2: ${{ secrets.PUMP_SIGNING_KEYSTORE_PASSWORD }}
          SP_ANDROID: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SP_GENERIC: ${{ secrets.KEYSTORE_PASSWORD }}
          KP_PUMP: ${{ secrets.PUMP_SIGNING_KEY_PASSWORD }}
          KP_ANDROID: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KP_GENERIC: ${{ secrets.KEY_PASSWORD }}
          AL_PUMP: ${{ secrets.PUMP_SIGNING_KEY_ALIAS }}
          AL_ANDROID: ${{ secrets.ANDROID_KEY_ALIAS }}
          AL_GENERIC: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED="1f778c4291c9d11c5f89f4de8773bda35a0125031adc05785daee23f27dc7823"
          KEYFILE="$RUNNER_TEMP/pump-compatible.jks"

          KEY_SOURCE=""
          for name in KS_PUMP KS_ANDROID KS_RELEASE KS_KEYSTORE; do
            value="${!name:-}"
            if [ -n "$value" ] && printf '%s' "$value" | base64 --decode > "$KEYFILE" 2>/dev/null && [ -s "$KEYFILE" ]; then
              KEY_SOURCE="$name"
              break
            fi
          done
          if [ -z "$KEY_SOURCE" ]; then
            echo "NO_CANDIDATE_KEYSTORE_SECRET_PRESENT; compatible signing deferred to offline recovery bundle"
            exit 0
          fi

          PASS=""
          for name in SP_PUMP SP_PUMP2 SP_ANDROID SP_GENERIC; do
            value="${!name:-}"
            if [ -n "$value" ] && keytool -list -keystore "$KEYFILE" -storepass "$value" >/dev/null 2>&1; then
              PASS="$value"
              break
            fi
          done
          test -n "$PASS" || { echo "KEYSTORE_FOUND_BUT_NO_MATCHING_PASSWORD_SECRET"; exit 42; }

          keytool -list -v -keystore "$KEYFILE" -storepass "$PASS" > "$RUNNER_TEMP/keyinfo.txt"
          FOUND=$(grep -i 'SHA256:' "$RUNNER_TEMP/keyinfo.txt" | tr -d ': ' | tr 'A-F' 'a-f' || true)
          printf '%s\n' "$FOUND" | grep -Fq "$EXPECTED" || { echo "KEYSTORE_CERTIFICATE_MISMATCH"; exit 43; }

          ALIAS=""
          for candidate in "${AL_PUMP:-}" "${AL_ANDROID:-}" "${AL_GENERIC:-}" "pump-signal-update" "pump-update"; do
            [ -z "$candidate" ] && continue
            if keytool -list -keystore "$KEYFILE" -storepass "$PASS" -alias "$candidate" >/dev/null 2>&1; then
              ALIAS="$candidate"
              break
            fi
          done
          test -n "$ALIAS" || { echo "MATCHED_CERT_BUT_ALIAS_NOT_RESOLVED"; exit 44; }

          KEYPASS=""
          for candidate in "${KP_PUMP:-}" "${KP_ANDROID:-}" "${KP_GENERIC:-}" "$PASS"; do
            [ -z "$candidate" ] && continue
            if "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
                --ks "$KEYFILE" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$candidate" \
                --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
                --out "$RUNNER_TEMP/test-signed.apk" app/build/outputs/apk/debug/app-debug.apk >/dev/null 2>&1; then
              KEYPASS="$candidate"
              break
            fi
          done
          test -n "$KEYPASS" || { echo "MATCHED_KEYSTORE_BUT_NO_SIGNING_PASSWORD"; exit 45; }

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$KEYFILE" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out PumpSignal-V6.9.11-Compatible-FINAL.apk app/build/outputs/apk/debug/app-debug.apk

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            PumpSignal-V6.9.11-Compatible-FINAL.apk | tee "$RUNNER_TEMP/final-signature.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/final-signature.txt"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/final-signature.txt"
          ACTUAL=$(grep -F "Signer #1 certificate SHA-256 digest:" "$RUNNER_TEMP/final-signature.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')
          test "$ACTUAL" = "$EXPECTED"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging PumpSignal-V6.9.11-Compatible-FINAL.apk | tee "$RUNNER_TEMP/final-badging.txt"
          grep -F "package: name='com.example.pumppaperbot.v8' versionCode='140' versionName='6.9.11'" "$RUNNER_TEMP/final-badging.txt"
          grep -F "launchable-activity: name='com.example.pumppaperbot.FusionDashboardActivity'" "$RUNNER_TEMP/final-badging.txt"
          unzip -t PumpSignal-V6.9.11-Compatible-FINAL.apk
          sha256sum PumpSignal-V6.9.11-Compatible-FINAL.apk | tee "$RUNNER_TEMP/final-sha256.txt"


      - name: Upload compatible signed APK (only when a matching signing key exists)
        if: ${{ hashFiles('PumpSignal-V6.9.11-Compatible-FINAL.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PUMP-Fusion-6.9.11-compatible-signed-APK
          path: PumpSignal-V6.9.11-Compatible-FINAL.apk
          retention-days: 7
