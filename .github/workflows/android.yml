name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Restore stable signing key
        run: base64 --decode signing/pump-signal-release.jks.b64 > "$RUNNER_TEMP/pump-signal-release.jks"

      - name: Test and build signed APK
        env:
          PUMP_SIGNING_STORE_FILE: ${{ runner.temp }}/pump-signal-release.jks
          PUMP_SIGNING_STORE_PASSWORD: pumpv34localrelease2026
          PUMP_SIGNING_KEY_ALIAS: pump-update
          PUMP_SIGNING_KEY_PASSWORD: pumpv34localrelease2026
        run: gradle testDebugUnitTest assembleRelease

      - name: Verify Android signatures
        run: "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare named APK
        run: cp app/build/outputs/apk/release/app-release.apk PumpSignal-V3.4-Gemini-Shadow-FIXED.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PumpSignal-V3.4-Gemini-Shadow-FIXED
          path: PumpSignal-V3.4-Gemini-Shadow-FIXED.apk
          retention-days: 30
