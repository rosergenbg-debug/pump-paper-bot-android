name: Android Build

on:
  push:
    branches: [ "main", "chatgpt/v6-6-x-core-alerts" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical checked-in source
        run: git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate and build V6.6.1
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Verify intermediate debug APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/signature.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/signature.txt"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.example.pumppaperbot.v8' versionCode='125' versionName='6.6.1'" \
            "$RUNNER_TEMP/badging.txt"
          grep -F "launchable-activity: name='com.example.pumppaperbot.V660DashboardActivity'" \
            "$RUNNER_TEMP/badging.txt"
          grep -F "application-debuggable" "$RUNNER_TEMP/badging.txt"
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 6000000

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PumpSignal-V6.6.1-Serge-App-Hotfix-Intermediate.apk

      - name: Upload intermediate APK
        uses: actions/upload-artifact@v4
        with:
          name: PumpSignal-V6.6.1-Serge-App-Hotfix-Intermediate-APK
          path: PumpSignal-V6.6.1-Serge-App-Hotfix-Intermediate.apk
          retention-days: 7
