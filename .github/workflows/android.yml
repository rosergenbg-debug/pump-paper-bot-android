name: V5.25 Compatible Build

on:
  push:
    branches: [ "chatgpt/v5-25-six-account-comparison" ]
    paths-ignore:
      - "dist/**"
  pull_request:
    branches: [ "chatgpt/v5-24-pump-machine-2" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded V5.19 to V5.25 source patches
        run: |
          python3 tools/apply_v519_sources.py
          python3 tools/apply_v520_persistence.py
          python3 tools/apply_v520_compile_fix.py
          python3 tools/apply_v521_pump_machine.py
          python3 tools/apply_v522_shared_entry.py
          python3 tools/apply_v523_clean_lab_reset.py
          python3 tools/apply_v524_pump_machine_2.py
          python3 tools/apply_v525_six_account_comparison.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate and build V5.25
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Verify intermediate V5.25 APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.example.pumppaperbot.v8' versionCode='105' versionName='5.25'" \
            "$RUNNER_TEMP/badging.txt"
          grep -F "launchable-activity: name='com.example.pumppaperbot.MainActivity'" \
            "$RUNNER_TEMP/badging.txt"
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 6000000

      - name: Sign V5.25 with compatible update key
        env:
          KS_PUMP: ${{ secrets.PUMP_SIGNING_KEYSTORE_BASE64 }}
          KS_ANDROID: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_RELEASE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SP_PUMP: ${{ secrets.PUMP_SIGNING_STORE_PASSWORD }}
          SP_PUMP2: ${{ secrets.PUMP_SIGNING_KEYSTORE_PASSWORD }}
          SP_ANDROID: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SP_GENERIC: ${{ secrets.KEYSTORE_PASSWORD }}
          KP_PUMP: ${{ secrets.PUMP_SIGNING_KEY_PASSWORD }}
          KP_ANDROID: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KP_GENERIC: ${{ secrets.KEY_PASSWORD }}
          AL_PUMP: ${{ secrets.PUMP_SIGNING_KEY_ALIAS }}
          AL_ANDROID: ${{ secrets.ANDROID_KEY_ALIAS }}
          AL_GENERIC: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED="1f778c4291c9d11c5f89f4de8773bda35a0125031adc05785daee23f27dc7823"
          KEYFILE="$RUNNER_TEMP/pump-compatible.jks"

          KEY_SOURCE=""
          for name in KS_PUMP KS_ANDROID KS_RELEASE KS_KEYSTORE; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              if printf '%s' "$value" | base64 --decode > "$KEYFILE" 2>/dev/null && [ -s "$KEYFILE" ]; then
                KEY_SOURCE="$name"
                break
              fi
            fi
          done
          if [ -z "$KEY_SOURCE" ]; then
            echo "NO_CANDIDATE_KEYSTORE_SECRET_PRESENT"
            exit 41
          fi
          echo "Compatible keystore secret found"

          PASS=""
          for name in SP_PUMP SP_PUMP2 SP_ANDROID SP_GENERIC; do
            value="${!name:-}"
            if [ -n "$value" ] && keytool -list -keystore "$KEYFILE" -storepass "$value" >/dev/null 2>&1; then
              PASS="$value"
              break
            fi
          done
          if [ -z "$PASS" ]; then
            echo "KEYSTORE_FOUND_BUT_NO_MATCHING_PASSWORD_SECRET"
            exit 42
          fi

          keytool -list -v -keystore "$KEYFILE" -storepass "$PASS" > "$RUNNER_TEMP/keyinfo.txt"
          FOUND=$(grep -i 'SHA256:' "$RUNNER_TEMP/keyinfo.txt" | tr -d ': ' | tr 'A-F' 'a-f' || true)
          if ! printf '%s\n' "$FOUND" | grep -Fq "$EXPECTED"; then
            echo "KEYSTORE_CERTIFICATE_DOES_NOT_MATCH_CURRENT_PUMPSIGNAL_UPDATE_CERT"
            exit 43
          fi
          echo "MATCHED_CURRENT_PUMPSIGNAL_CERTIFICATE_SHA256=$EXPECTED"

          ALIAS=""
          for candidate in "${AL_PUMP:-}" "${AL_ANDROID:-}" "${AL_GENERIC:-}" "pump-signal-update" "pump-update"; do
            [ -z "$candidate" ] && continue
            if keytool -list -keystore "$KEYFILE" -storepass "$PASS" -alias "$candidate" >/dev/null 2>&1; then
              ALIAS="$candidate"
              break
            fi
          done
          if [ -z "$ALIAS" ]; then
            echo "MATCHED_CERT_BUT_ALIAS_NOT_RESOLVED"
            exit 44
          fi

          KEYPASS=""
          for candidate in "${KP_PUMP:-}" "${KP_ANDROID:-}" "${KP_GENERIC:-}" "$PASS"; do
            [ -z "$candidate" ] && continue
            if "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
                --ks "$KEYFILE" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$candidate" \
                --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
                --out "$RUNNER_TEMP/test-signed.apk" app/build/outputs/apk/debug/app-debug.apk >/dev/null 2>&1; then
              KEYPASS="$candidate"
              break
            fi
          done
          if [ -z "$KEYPASS" ]; then
            echo "MATCHED_KEYSTORE_BUT_NO_SIGNING_KEY_PASSWORD_MATCHED"
            exit 45
          fi

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$KEYFILE" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out PumpSignal-V5.25-Compatible-FINAL.apk app/build/outputs/apk/debug/app-debug.apk

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            PumpSignal-V5.25-Compatible-FINAL.apk | tee "$RUNNER_TEMP/final-signature.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/final-signature.txt"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/final-signature.txt"
          ACTUAL=$(grep -F "Signer #1 certificate SHA-256 digest:" "$RUNNER_TEMP/final-signature.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')
          test "$ACTUAL" = "$EXPECTED"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging PumpSignal-V5.25-Compatible-FINAL.apk | tee "$RUNNER_TEMP/final-badging.txt"
          grep -F "package: name='com.example.pumppaperbot.v8' versionCode='105' versionName='5.25'" "$RUNNER_TEMP/final-badging.txt"
          grep -F "launchable-activity: name='com.example.pumppaperbot.MainActivity'" "$RUNNER_TEMP/final-badging.txt"
          unzip -t PumpSignal-V5.25-Compatible-FINAL.apk >/dev/null
          sha256sum PumpSignal-V5.25-Compatible-FINAL.apk | tee "$RUNNER_TEMP/final-sha256.txt"

      - name: Upload compatible V5.25 APK
        uses: actions/upload-artifact@v4
        with:
          name: PumpSignal-V5.25-Compatible-FINAL
          path: PumpSignal-V5.25-Compatible-FINAL.apk
          retention-days: 7

      - name: Publish signed APK to branch
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp PumpSignal-V5.25-Compatible-FINAL.apk dist/PumpSignal-V5.25-Compatible-FINAL.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/PumpSignal-V5.25-Compatible-FINAL.apk
          git diff --cached --quiet && exit 0
          git commit -m "Publish signed PumpSignal V5.25 APK"
          git push
