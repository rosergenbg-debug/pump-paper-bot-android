name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Test and build APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PumpSignal-V3-Shadow-Radar-v3.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PumpSignal-V3-Shadow-Radar-v3.3-APK
          path: PumpSignal-V3-Shadow-Radar-v3.3.apk
          retention-days: 30

      - name: Publish v3.3 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3
          name: PUMP Сигнал v3.3 — проверенный 5m Shadow Radar
          prerelease: true
          body: |
            Добавлен отдельный 5-минутный Shadow Radar: объём, устойчивый spot/futures taker-поток, сжатие, относительная сила PUMP против BTC/SOL и изменение OI за 10 минут.
            Проверка на 90 534 пятиминутных свечах показала, что прямой быстрый вход по предложениям Gemini убыточен. Поэтому Shadow Radar ничего не меняет в BUY/SELL и сохраняет наблюдения в отдельный CSV для будущего walk-forward.
            Старые RSS-заголовки больше не отправляются в Gemini повторно. При HTTP 429 от Google Search подробная проверка один раз повторяется без поиска и честно показывает fallback.
            Сохранены торговая логика V3.2, информационная поправка ±12 в режиме наблюдения, аварийная тревога 25%+ и комиссия 0,15% на каждую сторону. Исторические результаты не гарантируют будущую прибыль.
          files: PumpSignal-V3-Shadow-Radar-v3.3.apk
