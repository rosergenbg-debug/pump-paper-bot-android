name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Restore stable personal signing key
        run: |
          git fetch --no-tags --depth=1 origin 25850ffbcce678b9c8033466b9e9b7a3eae1c075
          git show FETCH_HEAD:signing/pump-signal-release.jks.b64 \
            | base64 --decode > "$RUNNER_TEMP/pump-signal-release.jks"

      - name: Test and build V3.6-compatible V3.19 debug APK
        env:
          PUMP_SIGNING_STORE_FILE: ${{ runner.temp }}/pump-signal-release.jks
          PUMP_SIGNING_STORE_PASSWORD: pumpv34localrelease2026
          PUMP_SIGNING_KEY_ALIAS: pump-update
          PUMP_SIGNING_KEY_PASSWORD: pumpv34localrelease2026
        run: gradle testDebugUnitTest assembleDebug

      - name: Verify intermediate debug APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/signature.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/signature.txt"
          grep -F "Signer #1 certificate SHA-256 digest: 1133e7d3e2cf17983e23dac1ec5b69f1be03e484c7ed1a32c16d24aaf473324c" \
            "$RUNNER_TEMP/signature.txt"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.example.pumppaperbot.v8' versionCode='51' versionName='3.19'" \
            "$RUNNER_TEMP/badging.txt"
          grep -F "launchable-activity: name='com.example.pumppaperbot.MainActivity'" \
            "$RUNNER_TEMP/badging.txt"
          grep -F "application-debuggable" "$RUNNER_TEMP/badging.txt"
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 6000000

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PumpSignal-V3.19-Intermediate.apk

      - name: Upload intermediate APK
        uses: actions/upload-artifact@v4
        with:
          name: PumpSignal-V3.19-Intermediate-APK
          path: PumpSignal-V3.19-Intermediate.apk
          retention-days: 30
